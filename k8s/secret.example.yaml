# TEMPLATE ONLY: never commit real values. Create the secret out of band, e.g.
#   kubectl -n visionstudio create secret generic visionstudio-secrets \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=GPU_WORKER_TOKEN="$(openssl rand -hex 32)" ...
# or copy this file to k8s/secret.yaml (git-ignored), fill it in, and `kubectl apply` it.
# The API and GPU worker refuse to start while JWT_SECRET_KEY / GPU_WORKER_TOKEN are unset.
apiVersion: v1
kind: Secret
metadata:
  name: visionstudio-secrets
  namespace: visionstudio
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://REPLACE_ME:REPLACE_ME@db:5432/visionstudio"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET_KEY: ""
  GPU_WORKER_TOKEN: ""
  R2_ACCOUNT_ID: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  R2_BUCKET_NAME: "visionstudio-media"
  GPU_WORKER_URL: "http://gpu-worker:8001"
