name: Android CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  # Manual release build from the Actions tab. From main it also updates the latest-main release;
  # from any other branch it only uploads the artifact.
  workflow_dispatch:

# A newer push to a PR supersedes the run in progress. Pushes to main queue instead, so a release
# build is never cancelled half-way through publishing.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: Android Unit Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK (ANDROID_HOME). Use its own sdkmanager to accept the
      # licenses and install exactly what this build compiles against.
      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      # Caches the Gradle distribution and dependencies, and validates gradle-wrapper.jar's checksum.
      - uses: gradle/actions/setup-gradle@v4

      # :core:model is a plain JVM module with no debug/release variants, so the variant test
      # tasks skip it; its tests run through `test`.
      - name: Unit tests (debug and release) and lint
        run: ./gradlew testDebugUnitTest testReleaseUnitTest :core:model:test lint --continue

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/tests/
            android/**/build/reports/lint-results-*.html
            android/**/build/test-results/
          retention-days: 7

  release-apk:
    name: Signed release APK
    needs: android
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create/update the latest-main release
    defaults:
      run:
        working-directory: android
    env:
      APK_DIR: app/build/outputs/apk/release
      APK_NAME: visionstudio-release.apk
      # Read by app/build.gradle.kts, together with the password and alias variables that the
      # restore step exports. Every build is signed with this one key, so each APK installs over
      # the previous one (adb install -r) without losing app data.
      VISIONSTUDIO_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      # SHA-256 of the release signing certificate. Phones only accept an update signed with the
      # key they already have, so a build signed with anything else fails here instead of being
      # published. Change this only when deliberately moving to a new key (users must reinstall).
      EXPECTED_SIGNER_SHA256: b310c4506541ab493d0189a67b93c3c0f52bc733df5ffb00d146cb52054986c9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Never fall back to a runner's throwaway debug key: an APK signed with it can't be
      # installed over the previous build.
      - name: Restore the release keystore
        # The raw secrets are visible to this step only; it exports cleaned copies for the rest.
        env:
          RAW_VISIONSTUDIO_KEYSTORE_BASE64: ${{ secrets.VISIONSTUDIO_KEYSTORE_BASE64 }}
          RAW_VISIONSTUDIO_KEYSTORE_PASSWORD: ${{ secrets.VISIONSTUDIO_KEYSTORE_PASSWORD }}
          RAW_VISIONSTUDIO_KEY_ALIAS: ${{ secrets.VISIONSTUDIO_KEY_ALIAS }}
          RAW_VISIONSTUDIO_KEY_PASSWORD: ${{ secrets.VISIONSTUDIO_KEY_PASSWORD }}
        run: |
          missing=""
          for name in VISIONSTUDIO_KEYSTORE_BASE64 VISIONSTUDIO_KEYSTORE_PASSWORD VISIONSTUDIO_KEY_ALIAS VISIONSTUDIO_KEY_PASSWORD; do
            raw="RAW_$name"
            [ -n "$(printf '%s' "${!raw}" | tr -d '[:space:]')" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Release signing not configured::Missing repository secrets:$missing. See android/README-release-signing.md."
            exit 1
          fi

          # Values pasted into the GitHub secret form often pick up line breaks, a trailing
          # newline or a CR. Base64 ignores all whitespace; the alias and passwords lose only
          # leading and trailing whitespace, and must then be a single line.
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }
          for name in VISIONSTUDIO_KEYSTORE_PASSWORD VISIONSTUDIO_KEY_ALIAS VISIONSTUDIO_KEY_PASSWORD; do
            raw="RAW_$name"
            value=$(trim "${!raw}")
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error title=Invalid $name::The secret spans several lines; it must be a single value."
              exit 1
            fi
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          if ! printf '%s' "$RAW_VISIONSTUDIO_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$VISIONSTUDIO_KEYSTORE_FILE"; then
            echo "::error title=Invalid VISIONSTUDIO_KEYSTORE_BASE64::The secret is not valid base64. Paste the whole value again (the output of base64 -w 0 visionstudio-release.jks)."
            exit 1
          fi

          # Open the keystore now, so a wrong password or alias fails with a clear message
          # instead of deep inside the Gradle build.
          if ! keytool -list -keystore "$VISIONSTUDIO_KEYSTORE_FILE" -storepass:env VISIONSTUDIO_KEYSTORE_PASSWORD \
              -alias "$VISIONSTUDIO_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Release keystore unusable::Could not open the keystore with VISIONSTUDIO_KEYSTORE_PASSWORD, or it has no key named VISIONSTUDIO_KEY_ALIAS."
            exit 1
          fi
          actual=$(keytool -exportcert -keystore "$VISIONSTUDIO_KEYSTORE_FILE" -alias "$VISIONSTUDIO_KEY_ALIAS" \
            -storepass:env VISIONSTUDIO_KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error title=Wrong release key::The keystore's certificate is $actual, not the release key $EXPECTED_SIGNER_SHA256. APKs signed with it could not be installed over existing builds."
            exit 1
          fi
          echo "Release keystore OK: certificate $actual"

      - name: Build signed R8 release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify signature and record checksum
        id: apk
        run: |
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          apk="$APK_DIR/app-release.apk"
          "$apksigner" verify --verbose "$apk"
          signed=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$signed" ] || [ "$signed" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK signer ($signed) is not the release key ($EXPECTED_SIGNER_SHA256)"
            exit 1
          fi
          cp "$apk" "$APK_DIR/$APK_NAME"
          size=$(stat -c %s "$APK_DIR/$APK_NAME")
          sha256=$(sha256sum "$APK_DIR/$APK_NAME" | cut -d' ' -f1)
          {
            echo "sha256=$sha256"
            echo "size=$size"
            echo "signer=$signed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $APK_NAME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Size | $size bytes |"
            echo "| SHA-256 | \`$sha256\` |"
            echo "| Signing certificate SHA-256 | \`$signed\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: visionstudio-release-apk
          path: android/${{ env.APK_DIR }}/${{ env.APK_NAME }}
          if-no-files-found: error

      # A plain .apk download (artifacts arrive zipped), at a URL that never changes:
      # https://github.com/<owner>/<repo>/releases/download/latest-main/visionstudio-release.apk
      - name: Publish to the latest-main release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SIZE: ${{ steps.apk.outputs.size }}
          SIGNER: ${{ steps.apk.outputs.signer }}
        run: |
          # The backticks are literal Markdown in the release notes, not command substitution.
          # shellcheck disable=SC2016
          notes=$(printf 'Signed R8 release build of `main` at %s.\n\n- Size: %s bytes\n- SHA-256: `%s`\n- Signing certificate SHA-256: `%s`\n\nReplaced on every push to `main`.' \
            "$GITHUB_SHA" "$SIZE" "$SHA256" "$SIGNER")
          if gh release view latest-main > /dev/null 2>&1; then
            # Move the tag to this commit, then refresh the notes and replace the asset.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-main" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit latest-main --title "Latest main build" --notes "$notes" --prerelease
          else
            gh release create latest-main --target "$GITHUB_SHA" --title "Latest main build" --notes "$notes" --prerelease
          fi
          gh release upload latest-main "$APK_DIR/$APK_NAME" --clobber
          echo "Release asset: $GITHUB_SERVER_URL/$GH_REPO/releases/download/latest-main/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
