# Dev services for GitHub Codespaces / VS Code Dev Containers.
# The GPU worker is not started here (it needs an NVIDIA GPU).
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      # Non-secret defaults; post-create.sh writes the rest (incl. generated secrets) to
      # backend/.env and frontend/.env.local.
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: visionstudio
      POSTGRES_PASSWORD: visionstudio  # local dev container only
      POSTGRES_DB: visionstudio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionstudio -d visionstudio"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
