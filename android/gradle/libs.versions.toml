[versions]
# Build toolchain
agp = "8.5.2"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
androidCompileSdk = "34"
androidTargetSdk = "34"
androidMinSdk = "26"

# AndroidX core
androidxCore = "1.13.1"
androidxActivity = "1.9.2"
androidxLifecycle = "2.8.5"
androidxNavigation = "2.8.0"
androidxHiltNavigationCompose = "1.2.0"
androidxHiltWork = "1.2.0"
androidxWork = "2.9.1"
androidxSecurityCrypto = "1.1.0-alpha06"
androidxExifInterface = "1.3.7"
androidxProfileInstaller = "1.3.1"
androidxBenchmark = "1.3.0"
androidxBaselineProfile = "1.3.0"
androidxSplashscreen = "1.0.1"

# Compose
composeBom = "2024.09.00"

# DI
hilt = "2.51.1"

# Persistence
room = "2.6.1"

# Networking & serialization
ktor = "2.3.12"
okhttp = "4.12.0"
kotlinxCoroutines = "1.8.1"
kotlinxSerializationJson = "1.7.2"

# Media
media3 = "1.4.1"
coil = "3.0.0"

# Testing
junit4 = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
androidxEspresso = "3.6.1"
androidxUiAutomator = "2.3.0"
mockk = "1.13.12"
turbine = "1.1.0"
robolectric = "4.13"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHiltWork" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "androidxWork" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidxSecurityCrypto" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "androidxExifInterface" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidxProfileInstaller" }
