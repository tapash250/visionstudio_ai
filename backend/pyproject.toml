[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionstudio-backend"
version = "1.0.0"
description = "Backend API for VisionStudio AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "VisionStudio AI Team", email = "team@visionstudio.app"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "pillow>=13.0.0",
    "boto3>=1.43.123",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "aiofiles>=25.1.0",
    "sentry-sdk[fastapi]>=2.73.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "fakeredis>=2.40.0",
    "ruff>=0.17.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# B008: FastAPI's Depends()/File() defaults are the documented idiom.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
